# Snow Shot 项目 Release 自动构建工作流
# 将显示在 GitHub 存储库的"操作"选项卡中的工作流名称
name: Release CI

concurrency:
    group: release-${{ github.event_name == 'workflow_dispatch' && inputs.version || github.ref_name }}
    cancel-in-progress: false

# 指定此工作流的触发器
on:
    push:
        # 匹配特定标签 (refs/tags)
        tags:
            - "v*" # 推送事件匹配 v*, 例如 v1.0，v20.15.10 等来触发工作流
    workflow_dispatch:
        inputs:
            version:
                description: "Version (e.g. v1.0.0)"
                required: true
                type: string

jobs:
    create-release:
        runs-on: ubuntu-latest
        permissions:
            contents: write
        steps:
            - uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Set version
              id: vars
              env:
                  EVENT_NAME: ${{ github.event_name }}
                  RELEASE_INPUT: ${{ inputs.version }}
                  DEFAULT_BRANCH: ${{ github.event.repository.default_branch }}
              run: |
                  if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ "$GITHUB_REF" != "refs/heads/$DEFAULT_BRANCH" ]; then
                    echo "workflow_dispatch releases must run from the default branch ($DEFAULT_BRANCH)" >&2
                    exit 1
                  fi

                  if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
                    TAG="$RELEASE_INPUT"
                  else
                    TAG="${GITHUB_REF#refs/tags/}"
                  fi

                  if [[ ! "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][0-9A-Za-z.+-]+)?$ ]]; then
                    echo "Invalid release tag: $TAG" >&2
                    exit 1
                  fi

                  # A signing release may only be built from code that is already
                  # reachable from the protected default branch. This prevents a
                  # tag on an arbitrary feature branch from exposing the signing
                  # secret to that branch's workflow contents.
                  git fetch --no-tags origin "refs/heads/$DEFAULT_BRANCH:refs/remotes/origin/$DEFAULT_BRANCH"
                  MAIN_SHA="$(git rev-parse "refs/remotes/origin/$DEFAULT_BRANCH")"
                  if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
                    RELEASE_SHA="$(git rev-parse HEAD)"
                    if [ "$RELEASE_SHA" != "$MAIN_SHA" ]; then
                      echo "Manual releases must run at the current default-branch commit ($MAIN_SHA)" >&2
                      exit 1
                    fi
                  elif ! git merge-base --is-ancestor "$GITHUB_SHA" "$MAIN_SHA"; then
                    echo "Tag $TAG does not point to a commit reachable from the default branch" >&2
                    exit 1
                  fi

                  VERSION="${TAG#v}"
                  CONFIG_VERSION="$(jq -r '.version' src-tauri/tauri.conf.json)"
                  CARGO_VERSION="$(awk '
                    /^\[package\]/{in_package=1; next}
                    /^\[/{in_package=0}
                    in_package && /^version[[:space:]]*=/ {
                      sub(/^[^=]*=/, "", $0)
                      gsub(/[[:space:]]/, "", $0)
                      gsub(/"/, "", $0)
                      print; exit
                    }
                  ' src-tauri/Cargo.toml)"
                  LOCK_VERSION="$(awk '
                    /^\[\[package\]\]/{in_package=0}
                    /^name = "snow-shot"$/{in_package=1; next}
                    in_package && /^version[[:space:]]*=/ {
                      sub(/^[^=]*=/, "", $0)
                      gsub(/[[:space:]]/, "", $0)
                      gsub(/"/, "", $0)
                      print; exit
                    }
                  ' src-tauri/Cargo.lock)"
                  if [ "$VERSION" != "$CONFIG_VERSION" ] || [ "$VERSION" != "$CARGO_VERSION" ] || [ "$VERSION" != "$LOCK_VERSION" ]; then
                    echo "Release version $VERSION must match tauri.conf.json ($CONFIG_VERSION), Cargo.toml ($CARGO_VERSION), and Cargo.lock ($LOCK_VERSION)" >&2
                    exit 1
                  fi

                  EXPECTED_ENDPOINT="https://github.com/llw2011/snow-shot/releases/latest/download/latest.json"
                  PUBKEY=""
                  for CONFIG_FILE in src-tauri/tauri.windows.conf.json src-tauri/tauri.macos.conf.json src-tauri/webview2.x64.json; do
                    CURRENT_PUBKEY="$(jq -er '.plugins.updater.pubkey' "$CONFIG_FILE")"
                    CURRENT_ENDPOINT="$(jq -r '.plugins.updater.endpoints[0] // empty' "$CONFIG_FILE")"
                    if [ -z "$PUBKEY" ]; then
                      PUBKEY="$CURRENT_PUBKEY"
                    elif [ "$PUBKEY" != "$CURRENT_PUBKEY" ]; then
                      echo "Updater public keys differ; refusing to build a release" >&2
                      exit 1
                    fi
                    if [[ "$CONFIG_FILE" != *webview2* ]] && [ "$CURRENT_ENDPOINT" != "$EXPECTED_ENDPOINT" ]; then
                      echo "Unexpected updater endpoint in $CONFIG_FILE" >&2
                      exit 1
                    fi
                  done
                  jq -e '.plugins.updater.endpoints == [] and .bundle.createUpdaterArtifacts == false' src-tauri/tauri.no-ota.conf.json >/dev/null
                  jq -e '.bundle.createUpdaterArtifacts == true' src-tauri/tauri.release.conf.json >/dev/null

                  {
                    echo "tag=$TAG"
                    echo "version=$VERSION"
                  } >> "$GITHUB_OUTPUT"
              shell: bash

            - name: Verify updater signing secrets
              env:
                  SIGNING_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
                  SIGNING_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
              run: |
                  if [ -z "$SIGNING_KEY" ] || [ -z "$SIGNING_PASSWORD" ]; then
                    echo "TAURI_SIGNING_PRIVATE_KEY and TAURI_SIGNING_PRIVATE_KEY_PASSWORD must be configured before a release." >&2
                    exit 1
                  fi
              shell: bash

            # 手动重跑只接受已经存在、且指向当前默认分支提交的 tag。
            # 不在 workflow 中 push tag，避免 workflow_dispatch 触发第二次
            # push-tags workflow 并重复发布同一个 Release。
            - name: Verify existing tag (manual trigger)
              if: github.event_name == 'workflow_dispatch'
              env:
                  RELEASE_TAG: ${{ steps.vars.outputs.tag }}
              run: |
                  if ! git rev-parse --verify --quiet "refs/tags/$RELEASE_TAG" >/dev/null; then
                    git fetch --no-tags origin "refs/tags/$RELEASE_TAG:refs/tags/$RELEASE_TAG"
                  fi
                  EXISTING_SHA="$(git rev-list -n 1 "$RELEASE_TAG")"
                  CURRENT_SHA="$(git rev-parse HEAD)"
                  if [ "$EXISTING_SHA" != "$CURRENT_SHA" ]; then
                    echo "Manual releases require $RELEASE_TAG to point to the current default-branch commit" >&2
                    exit 1
                  fi
            # 安装 Node.js
            - name: Setup node
              uses: actions/setup-node@v4
              with:
                  node-version: 20

            # 发布 Release，使用自定义名称
            - name: Generate changelog
              id: create_release
              env:
                  RELEASE_TAG: ${{ steps.vars.outputs.tag }}
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: npx --yes changelogithub@14.0.0 --draft --name "$RELEASE_TAG"

            - name: Set app version output
              id: app_version
              run: |
                  echo "tag=${{ steps.vars.outputs.tag }}" >> "$GITHUB_OUTPUT"
                  echo "version=${{ steps.vars.outputs.version }}" >> "$GITHUB_OUTPUT"

        outputs:
            release_tag: ${{ steps.app_version.outputs.tag }}
            app_version: ${{ steps.app_version.outputs.version }}

    # 编译 Tauri 应用
    build-app:
        needs: create-release
        permissions:
            contents: write
        strategy:
            fail-fast: false
            max-parallel: 1
            matrix:
                include:
                    # macOS Apple Silicon (M1/M2/M3)
                    - platform: "macos-latest"
                      target: "aarch64-apple-darwin"
                      ota: true
                      config: "src-tauri/tauri.release.conf.json"

                    # macOS Intel x64
                    - platform: "macos-15-intel"
                      target: "x86_64-apple-darwin"
                      ota: true
                      config: "src-tauri/tauri.release.conf.json"

                    # Windows standard
                    - platform: "windows-latest"
                      target: "x86_64-pc-windows-msvc"
                      ota: true
                      config: "src-tauri/tauri.release.conf.json"

                    # Windows with fixed runtime
                    - platform: "windows-latest"
                      target: "x86_64-pc-windows-msvc"
                      fixedRuntime: true
                      ota: false
                      config: "src-tauri/tauri.no-ota.conf.json"

                    # Windows offline version
                    - platform: "windows-latest"
                      target: "x86_64-pc-windows-msvc"
                      offline: true
                      ota: false
                      config: "src-tauri/tauri.no-ota.conf.json"

        runs-on: ${{ matrix.platform }}
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4

            # 安装 Node.js 和 pnpm
            - name: Setup node
              uses: actions/setup-node@v4
              with:
                  node-version: 20

            - name: Setup pnpm
              uses: pnpm/action-setup@v3
              with:
                  version: 10.8.1

            # 安装 Rust
            - name: Install Rust stable
              uses: dtolnay/rust-toolchain@stable

            - name: Install rust target
              run: rustup target add ${{ matrix.target }}

            # 使用 Rust 缓存，加快安装速度
            - name: Rust cache
              uses: swatinem/rust-cache@v2
              with:
                  workspaces: src-tauri -> target

            # 配置 pnpm 缓存
            - name: Setup pnpm cache
              uses: actions/setup-node@v4
              with:
                  node-version: 20
                  cache: pnpm

            # 安装 yarn
            - name: Install yarn
              run: npm install -g yarn

            # 准备 Excalidraw 依赖
            - name: Clone Excalidraw
              run: |
                  cd ..
                  git clone https://github.com/mg-chao/excalidraw.git
                  cd excalidraw
                  git checkout d57ac317fc926bba6f7332e9ac24de7a84359d5f # custom/master snapshot
              shell: bash

            # 配置 yarn 缓存
            - name: Cache yarn dependencies
              uses: actions/cache@v4
              with:
                  path: |
                      ~/.yarn/cache
                      ~/.cache/yarn
                  key: ${{ runner.os }}-yarn-${{ hashFiles('**/yarn.lock') }}
                  restore-keys: |
                      ${{ runner.os }}-yarn-

            # 安装 Excalidraw 依赖
            - name: Install Excalidraw dependencies
              run: |
                  cd ../excalidraw
                  yarn install --frozen-lockfile
                  cd ../snow-shot
              shell: bash

            # 创建 .env 文件以支持联网功能
            - name: Create .env file
              run: |
                  if [ "${{ matrix.offline }}" = "true" ]; then
                    echo "PUBLIC_ONLINE_STATUS=false" > .env
                  else
                    echo "PUBLIC_ONLINE_STATUS=true" > .env
                  fi
              shell: bash

            # 安装前端依赖并打包
            - name: Install app dependencies and build web
              run: pnpm install --frozen-lockfile

            # 安装 offline 版本额外依赖
            - name: Install offline version dependencies
              if: matrix.offline == true
              run: pnpm install qr-scanner-wechat@0.1.3

            # 构建 Excalidraw
            - name: Build Excalidraw
              run: pnpm update:excalidraw

            # 下载 offline 资源 (Windows offline only)
            - name: Download and setup offline resources
              if: matrix.platform == 'windows-latest' && matrix.offline == true
              run: |
                  # 下载 npm.zip
                  Write-Host "Downloading npm.zip..."
                  Invoke-WebRequest -Uri "https://github.com/mg-chao/snow-shot-webview-runtime/releases/download/Resources_20251107/npm.zip" -OutFile "npm.zip"
                  if ((Get-FileHash -Algorithm SHA256 -LiteralPath "npm.zip").Hash.ToLowerInvariant() -ne "6547bd788af982a9d3c7a3cdb4fed88acebd93be81ee81cb1bbc72c121abdf00") {
                    throw "npm.zip SHA-256 does not match the pinned release asset"
                  }

                  # 解压 npm.zip 到 public 目录
                  Write-Host "Extracting npm.zip to public directory..."
                  Expand-Archive -Path "npm.zip" -DestinationPath "public" -Force

                  # 删除不需要的 npm/qr-scanner-wechat 文件夹
                  Write-Host "Removing npm/qr-scanner-wechat folder..."
                  Remove-Item -Path "public\npm\qr-scanner-wechat" -Recurse -Force -ErrorAction SilentlyContinue

                  # 清理临时文件
                  Remove-Item -Path "npm.zip" -Force

                  Write-Host "Offline resources setup completed successfully"
              shell: pwsh

            # 下载并配置 onnxruntime (Windows only)
            - name: Download and setup onnxruntime (Windows)
              if: matrix.platform == 'windows-latest'
              run: |
                  # 下载 onnxruntime
                  Invoke-WebRequest -Uri "https://github.com/supertone-inc/onnxruntime-build/releases/download/v1.22.2/onnxruntime-win-x64-static_lib-1.22.2.zip" -OutFile "onnxruntime.zip"
                  if ((Get-FileHash -Algorithm SHA256 -LiteralPath "onnxruntime.zip").Hash.ToLowerInvariant() -ne "6d44e096a5e1eab6dbf47dc6ff4c70e838cd72a161507e3dca239fbb85d63b66") {
                    throw "onnxruntime.zip SHA-256 does not match the pinned release asset"
                  }

                  # 解压文件
                  Expand-Archive -Path "onnxruntime.zip" -DestinationPath "onnxruntime-temp" -Force

                  # 查找并移动 lib 文件夹到 src-tauri
                  $libPath = Get-ChildItem -Path "onnxruntime-temp" -Recurse -Directory -Filter "lib" | Select-Object -First 1
                  if ($libPath) {
                    Copy-Item -Path $libPath.FullName -Destination "src-tauri\lib" -Recurse -Force
                    Write-Host "Successfully copied lib folder to src-tauri"
                  } else {
                    Write-Error "lib folder not found in extracted files"
                    exit 1
                  }

                  # 清理临时文件
                  Remove-Item -Path "onnxruntime.zip" -Force
                  Remove-Item -Path "onnxruntime-temp" -Recurse -Force
              shell: pwsh

            # 下载并配置 WebView2 Fixed Runtime (Windows fixedRuntime only)
            - name: Download and setup WebView2 Fixed Runtime
              if: matrix.platform == 'windows-latest' && matrix.fixedRuntime == true
              run: |
                  # 下载 WebView2 Fixed Runtime v141.0.3537.99
                  $runtimeVersion = "141.0.3537.99"
                  $cabUrl = "https://github.com/mg-chao/snow-shot-webview-runtime/releases/download/v141.0.3537.99/Microsoft.WebView2.FixedVersionRuntime.141.0.3537.99.x64.cab"
                  $cabFile = "Microsoft.WebView2.FixedVersionRuntime.$runtimeVersion.x64.cab"

                  Write-Host "Downloading WebView2 Fixed Runtime $runtimeVersion..."
                  Invoke-WebRequest -Uri $cabUrl -OutFile $cabFile
                  if ((Get-FileHash -Algorithm SHA256 -LiteralPath $cabFile).Hash.ToLowerInvariant() -ne "a1dfd3992543afb6c44da3db0bd5c43d750b00068253ebd41e23f4d610052514") {
                    throw "WebView2 CAB SHA-256 does not match the pinned release asset"
                  }

                  # 解压 cab 文件到 src-tauri 目录
                  Write-Host "Extracting WebView2 Fixed Runtime..."
                  $targetDir = ".\src-tauri\Microsoft.WebView2.FixedVersionRuntime.$runtimeVersion.x64"

                  # 创建目标目录
                  New-Item -Path $targetDir -ItemType Directory -Force | Out-Null

                  # 使用 expand 命令解压
                  Expand -F:* $cabFile $targetDir

                  Write-Host "Successfully extracted WebView2 Fixed Runtime to $targetDir"

                  # 清理临时文件
                  Remove-Item -Path $cabFile -Force

                  # 移除原有的 tauri.windows.conf.json 并使用 webview2.x64.json
                  Write-Host "Replacing tauri.windows.conf.json with webview2.x64.json..."
                  Remove-Item -Path ".\src-tauri\tauri.windows.conf.json" -Force -ErrorAction SilentlyContinue
                  Move-Item -Path ".\src-tauri\webview2.x64.json" -Destination ".\src-tauri\tauri.windows.conf.json" -Force
                  Write-Host "Configuration files updated successfully"
              shell: pwsh

            # 下载并配置 onnxruntime (macOS only)
            - name: Download and setup onnxruntime (macOS)
              if: runner.os == 'macOS'
              run: |
                  # 下载 onnxruntime
                  curl -L -o onnxruntime.tgz "https://github.com/supertone-inc/onnxruntime-build/releases/download/v1.22.2/onnxruntime-osx-universal2-static_lib-1.22.2.tgz"
                  echo "aaa1a7dc5e4c2888cb5048a79af250c70f6d01d06dd6f7569b8b08a2bea01b98  onnxruntime.tgz" | shasum -a 256 -c -

                  # 解压文件
                  mkdir -p onnxruntime-temp
                  tar -xzf onnxruntime.tgz -C onnxruntime-temp

                  # 查找并移动 lib 文件夹到 src-tauri
                  libPath=$(find onnxruntime-temp -type d -name "lib" | head -n 1)
                  if [ -n "$libPath" ]; then
                    cp -r "$libPath" src-tauri/lib
                    echo "Successfully copied lib folder to src-tauri"
                  else
                    echo "Error: lib folder not found in extracted files"
                    exit 1
                  fi

                  # 清理临时文件
                  rm -f onnxruntime.tgz
                  rm -rf onnxruntime-temp
              shell: bash

            # macOS 专用：配置构建环境
            - name: Configure build environment (macOS)
              if: runner.os == 'macOS'
              run: |
                  # 设置环境变量强制静态链接
                  echo "PKG_CONFIG_ALL_STATIC=1" >> $GITHUB_ENV
                  echo "MACOSX_DEPLOYMENT_TARGET=12.3" >> $GITHUB_ENV

                  # 安装必要的库
                  brew install xz

                  # 设置 pkg-config 路径，确保能找到静态库
                  echo "PKG_CONFIG_PATH=/opt/homebrew/lib/pkgconfig:/usr/local/lib/pkgconfig" >> $GITHUB_ENV
              shell: bash

            # 设置文件名模式
            - name: Set asset name pattern
              id: asset_pattern
              run: |
                  if [ "${{ matrix.fixedRuntime }}" = "true" ]; then
                    echo "pattern=Snow Shot_[version]_[platform]-[arch]_webview[_setup][ext]" >> $GITHUB_OUTPUT
                  elif [ "${{ matrix.offline }}" = "true" ]; then
                    echo "pattern=Snow Shot_[version]_[platform]-[arch]_offline[_setup][ext]" >> $GITHUB_OUTPUT
                  else
                    echo "pattern=Snow Shot_[version]_[platform]-[arch][_setup][ext]" >> $GITHUB_OUTPUT
                  fi
              shell: bash

            # 执行构建，以及推送 github release
            - name: Build the app
              uses: tauri-apps/tauri-action@84b9d35b5fc46c1e45415bdb6144030364f7ebc5 # v0
              env:
                  CI: false
                  PLATFORM: ${{ matrix.platform }}
                  GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  TAURI_SIGNING_PRIVATE_KEY: ${{ matrix.ota && secrets.TAURI_SIGNING_PRIVATE_KEY || '' }}
                  TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ matrix.ota && secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD || '' }}
              with:
                  tagName: ${{ needs.create-release.outputs.release_tag }}
                  releaseName: Snow Shot ${{ needs.create-release.outputs.release_tag }}
                  assetNamePattern: ${{ steps.asset_pattern.outputs.pattern }}
                  includeUpdaterJson: ${{ matrix.ota }}
                  releaseBody: ""
                  releaseDraft: true
                  prerelease: false
                  args: --ci --target ${{ matrix.target }} --config ${{ matrix.config }} -- --locked

            - name: Verify dependency lockfiles were not rewritten
              run: git diff --exit-code -- src-tauri/Cargo.lock

    # 更新 Release 下载引导
    update-release-notes:
        name: Update Release Notes with Download Guide
        runs-on: ubuntu-latest
        needs: [create-release, build-app]
        permissions:
            contents: write
        steps:
            - name: Checkout repository
              uses: actions/checkout@v4
              with:
                  fetch-depth: 0

            - name: Validate updater manifest
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
                  RELEASE_TAG: ${{ needs.create-release.outputs.release_tag }}
                  EXPECTED_VERSION: ${{ needs.create-release.outputs.app_version }}
              run: |
                  set -euo pipefail
                  release_id="$(gh api "repos/$GITHUB_REPOSITORY/releases/tags/$RELEASE_TAG" --jq '.id')"
                  asset_url="$(gh api "repos/$GITHUB_REPOSITORY/releases/$release_id/assets?per_page=100" --jq '.[] | select(.name == "latest.json") | .url' | head -n 1)"
                  if [ -z "$asset_url" ]; then
                    echo "The release does not contain latest.json; refusing to publish OTA." >&2
                    exit 1
                  fi

                  manifest_file="$(mktemp)"
                  trap 'rm -f "$manifest_file"' EXIT
                  gh api "$asset_url" -H 'Accept: application/octet-stream' > "$manifest_file"

                  jq -e --arg expected "$EXPECTED_VERSION" --arg tag "$RELEASE_TAG" '
                    . as $manifest
                    | ($manifest.version == $expected)
                    and ($manifest.platforms | type == "object")
                    and (["windows-x86_64", "darwin-aarch64", "darwin-x86_64"]
                      | all(.[]; . as $platform |
                          ($manifest.platforms[$platform] | type == "object")
                          and ($manifest.platforms[$platform].signature | type == "string" and length > 0)
                          and ($manifest.platforms[$platform].url | type == "string"
                            and startswith("https://github.com/llw2011/snow-shot/releases/download/" + $tag + "/"))
                        ))
                  ' "$manifest_file" >/dev/null

                  echo "Updater manifest validated for $RELEASE_TAG ($EXPECTED_VERSION)."

            - name: Generate Release Notes
              run: |
                  cat > release_notes.md << EOF
                  ## ⚠️ Windows 用户注意

                  由于 Windows 系统更新导致应用渲染性能下降，建议暂时使用 **WebView2 内置版**以获得更好的使用体验。

                  EOF

            - name: Update Release
              uses: softprops/action-gh-release@v2
              with:
                  tag_name: ${{ needs.create-release.outputs.release_tag }}
                  name: "Snow Shot ${{ needs.create-release.outputs.release_tag }}"
                  body_path: release_notes.md
                  draft: false
                  prerelease: false
                  token: ${{ secrets.GITHUB_TOKEN }}
